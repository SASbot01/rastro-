# Tunel de Cloudflare para rastropro.com (se rellena en el servidor tras `cloudflared tunnel create rastro`).
# El UUID y el fichero de credenciales los imprime ese comando. pm2 lo arranca: deploy/ecosystem.config.cjs
tunnel: TUNNEL_UUID
credentials-file: /home/s4sf/.cloudflared/TUNNEL_UUID.json
ingress:
  - hostname: rastropro.com
    service: http://localhost:3000
  - hostname: www.rastropro.com
    service: http://localhost:3000
  - service: http_status:404
