<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1080px;height:1350px;background:#0a0a0a;color:#f4f4f2;font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .slide{position:relative;width:1080px;height:1350px;box-sizing:border-box;overflow:hidden;background:#0a0a0a}
  .top{position:absolute;left:72px;right:72px;top:64px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .logo{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700;letter-spacing:.14em;color:#f4f4f2}
  .logo img{height:36px;width:auto}
  .site{font-size:20px;font-weight:500;color:#6f6f6a;letter-spacing:.02em}
  h1{position:absolute;left:72px;right:72px;top:176px;margin:0;font-weight:800;letter-spacing:-0.035em;line-height:1.02;z-index:5}
  .g{color:#4dfc5f}
  .sub{position:absolute;left:72px;right:72px;margin:0;font-size:30px;line-height:1.4;font-weight:500;color:#a3a39e;z-index:5}
  .glow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(77,252,95,.32),rgba(77,252,95,0));filter:blur(20px);z-index:1}
  .phone{position:absolute;left:50%;transform:translateX(-50%);width:640px;border:12px solid #232323;border-radius:78px;background:#000;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 2px #0a0a0a;z-index:3}
  .phone img{display:block;width:100%;height:auto}
  .arrow{position:absolute;right:72px;bottom:64px;width:88px;height:88px;border-radius:50%;background:#4dfc5f;display:flex;align-items:center;justify-content:center;z-index:6}
  .arrow svg{width:40px;height:40px}
  ul{position:absolute;list-style:none;margin:0;padding:0;display:grid;gap:26px;z-index:5}
  li{display:flex;align-items:center;gap:20px;font-size:34px;font-weight:600;color:#f4f4f2}
  li::before{content:"";width:16px;height:16px;border-radius:50%;background:#4dfc5f;flex:none}
  .mascot{position:absolute;z-index:2}
  .mark{position:absolute;z-index:1;opacity:.07}
  .url{position:absolute;left:72px;right:72px;text-align:center;font-size:52px;font-weight:700;color:#4dfc5f;letter-spacing:-0.02em;z-index:5}
  .fade{position:absolute;left:0;right:0;bottom:0;height:220px;background:linear-gradient(to bottom,rgba(10,10,10,0),rgba(10,10,10,.9));z-index:4}
</style></head><body><div class="slide">
<div class="top"><div class="logo"><img src="../../../../public/brand/logo.png" alt="">RASTRO</div><div class="site">rastropro.com</div></div>
<div class="glow" style="width:900px;height:900px;right:-300px;bottom:-250px"></div>
<h1 style="font-size:100px">Rastro te lo&nbsp;enseña.</h1>
<ul style="left:72px;top:400px;width:560px"><li>Qué se ve de ti</li><li>Qué de eso es mentira</li><li>Cómo pedir que lo quiten</li></ul>
<div class="phone" style="top:660px;left:auto;right:-60px;transform:none;width:600px"><img src="../../shots/panel.png" alt=""></div>
<div class="arrow" style="right:auto;left:72px"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div></body></html>
