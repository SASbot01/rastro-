<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1080px;height:1350px;background:#0a0a0a;color:#f4f4f2;font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .slide{position:relative;width:1080px;height:1350px;padding:120px 96px;box-sizing:border-box;display:flex;flex-direction:column}
  h1{margin:0;font-weight:700;letter-spacing:-0.035em;line-height:1.06}
  .g{color:#4dfc5f}
  .line{width:180px;height:6px;background:#4dfc5f;border-radius:3px;margin-top:56px}
  .cards{display:grid;gap:18px;margin-top:72px}
  .card{background:#151515;border:1px solid #262626;border-radius:28px;padding:34px 40px;font-size:34px;font-weight:500;color:#f4f4f2}
  .bubble{margin-top:88px;width:640px;height:220px;background:#151515;border:1px solid #262626;border-radius:44px 44px 44px 12px;position:relative}
  .bubble .dot{position:absolute;left:44px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:#4dfc5f;box-shadow:0 0 0 12px rgba(77,252,95,.15)}
  .bubble .dots{position:absolute;left:100px;top:50%;transform:translateY(-50%);display:flex;gap:16px}
  .bubble .dots i{width:18px;height:18px;border-radius:50%;background:#2b2b2b;display:block}
  ul{list-style:none;margin:80px 0 0;padding:0;display:grid;gap:44px}
  li{display:flex;align-items:center;gap:28px;font-size:44px;font-weight:500;color:#f4f4f2}
  li::before{content:"";width:18px;height:18px;border-radius:50%;background:#4dfc5f;flex:none}
  .center{justify-content:center;align-items:center;text-align:center}
  .brand{position:absolute;left:96px;bottom:96px;display:flex;align-items:center;gap:18px;font-size:26px;font-weight:600;color:#6f6f6a;letter-spacing:.02em}
  .brand img{height:34px;width:auto}
  .url{margin-top:40px;font-size:44px;font-weight:600;color:#4dfc5f;letter-spacing:-0.01em}
  .ring{position:absolute;left:50%;top:50%;width:880px;height:880px;transform:translate(-50%,-50%);opacity:.22}
</style></head><body><div class="slide"><h1 style="font-size:92px">Tú no la has escrito.<br>Pero está ahí.</h1><div class="cards"><div class="card">Un formulario de 2014</div><div class="card">Una tienda que perdió su base de datos</div><div class="card">Una web que revende direcciones</div></div><div class="brand"><img src="../../../../public/brand/logo.png" alt="">Rastro</div></div></body></html>
