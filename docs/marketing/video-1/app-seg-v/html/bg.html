<!doctype html><html lang="es"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#f4f4f2;-webkit-font-smoothing:antialiased;overflow:hidden}
.title{position:absolute;left:64px;right:64px;top:210px;font-size:88px;font-weight:800;letter-spacing:-0.035em;line-height:1.04}
.g{color:#4dfc5f}
.chip{position:absolute;left:64px;display:inline-flex;align-items:center;gap:18px;padding:20px 34px;border-radius:999px;background:#151515;border:2px solid #2a2a2a;font-size:36px;font-weight:600;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.chip i{width:14px;height:14px;border-radius:50%;background:#4dfc5f;display:block}
.chip.red i{background:#ff5f5f}.chip.warn i{background:#ffb020}
.chip b{font-weight:800}
.phone{position:absolute;left:150px;top:880px;width:780px;border:16px solid #262626;border-radius:96px 96px 0 0;background:#000;overflow:hidden;box-shadow:0 -40px 140px rgba(0,0,0,.7),0 0 0 3px #0f0f0f}
.phone img{display:block;width:100%}
.bg{position:absolute;inset:0;background:#0a0a0a}
.glow{position:absolute;left:-300px;top:900px;width:1700px;height:1700px;border-radius:50%;background:radial-gradient(closest-side,rgba(77,252,95,.22),rgba(77,252,95,0))}
.brand{position:absolute;left:64px;top:96px;display:flex;align-items:center;gap:16px;font-size:28px;font-weight:700;letter-spacing:.16em;color:#a3a39e}
.brand img{height:40px}
.url{position:absolute;right:64px;top:100px;font-size:26px;font-weight:600;color:#6f6f6a}
</style></head><body><div class="bg"></div><div class="glow"></div><div class="brand"><img src="../../../../../public/brand/logo.png">RASTRO</div><div class="url">rastropro.com</div></body></html>
